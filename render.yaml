# Render Blueprint for the CodeVerity backend (monorepo: backend lives in ./backend).
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Secret values (sync: false) are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: codeverity-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    # NOTE: pre-deploy commands need a paid Render plan. The Neon DB is already migrated,
    # so no migration step runs here. If the schema changes later, run migrations manually
    # (locally: `python -m app.db.migrate`, or via a paid plan's pre-deploy command).
    envVars:
      # --- Runtime (non-secret) ---
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MESSAGING_PROVIDER
        value: meta
      - key: META_GRAPH_VERSION
        value: v22.0
      - key: FIREWORKS_MODEL
        value: accounts/fireworks/models/gpt-oss-120b
      - key: VISION_MODEL
        value: accounts/fireworks/models/glm-5p3-flash
      # CORS + public URL depend on the deployed hostnames — set after the first deploy.
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # --- Secrets (enter in the Render dashboard) ---
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_CUSTOM_DOMAIN
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
